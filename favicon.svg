<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfeaff"/>
      <stop offset="1" stop-color="#9dbcf2"/>
    </linearGradient>
    <linearGradient id="bot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5c84c9"/>
      <stop offset="1" stop-color="#2c4a85"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#000"/>
  <!-- Deux disques décalés : le solde, ce qui reste quand tout est compté -->
  <circle cx="292" cy="292" r="110" fill="url(#bot)"/>
  <circle cx="220" cy="220" r="110" fill="url(#top)" stroke="#000" stroke-width="14"/>
</svg>
